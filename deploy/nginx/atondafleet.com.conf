# AtondaFleet — static frontend + API reverse proxy
# Install: sudo cp deploy/nginx/atondafleet.com.conf /etc/nginx/sites-available/atondafleet.com
#          sudo ln -sf /etc/nginx/sites-available/atondafleet.com /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
# SSL:     sudo certbot --nginx -d atondafleet.com -d www.atondafleet.com

server {
    listen 80;
    listen [::]:80;
    server_name atondafleet.com www.atondafleet.com;

    root /var/www/atondafleet/frontend/dist;
    index index.html;

    # API → atonda-api (adjust port if your PM2 app uses another)
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA — Vite build
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
