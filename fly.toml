app = "fleet-api-tkapesa"
primary_region = "iad"

[build]
  dockerfile = "backend/Dockerfile"

[env]
  DATABASE_URL = "sqlite:////data/truck_app.db"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/"

[[mounts]]
  source = "fleet_data"
  destination = "/data"
  initial_size = "1gb"